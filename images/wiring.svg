<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<title>Steering Wheel wiring diagram</title>
<rect width="900" height="560" fill="#0f172a"/>
<text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="600">Steering Wheel – Wiring (STM32L432KC Nucleo-32)</text>
<!-- MCU -->
<rect x="330" y="60" width="240" height="330" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
<text x="450" y="90" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="600">STM32L432KC</text>
<text x="450" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">FreeRTOS (CMSIS-RTOS V2)</text>
<g fill="#e2e8f0">
<text x="342" y="150">PA3</text>
<text x="342" y="190">PA4</text>
<text x="342" y="230">PA5</text>
<text x="342" y="270">PA6</text>
<text x="558" y="150" text-anchor="end">PA7 I2C3_SCL</text>
<text x="558" y="190" text-anchor="end">PB4 I2C3_SDA</text>
<text x="558" y="230" text-anchor="end">3V3</text>
<text x="558" y="270" text-anchor="end">GND</text>
<text x="342" y="370">PA8 TIM1 PWM</text>
<text x="558" y="385" text-anchor="end">USB (ST-LINK VCP)</text>
</g>
<!-- buttons -->
<g stroke="#fbbf24" stroke-width="2" fill="none">
<path d="M330 146 H230"/><path d="M330 186 H230"/><path d="M330 226 H230"/><path d="M330 266 H230"/>
</g>
<g font-size="12" fill="#e2e8f0">
<g transform="translate(30,0)">
<rect x="130" y="133" width="70" height="26" rx="4" fill="#334155" stroke="#fbbf24"/><text x="165" y="150" text-anchor="middle">RESET / CENTER</text>
<rect x="130" y="173" width="70" height="26" rx="4" fill="#334155" stroke="#fbbf24"/><text x="165" y="190" text-anchor="middle">LEFT</text>
<rect x="130" y="213" width="70" height="26" rx="4" fill="#334155" stroke="#fbbf24"/><text x="165" y="230" text-anchor="middle">RIGHT</text>
<rect x="130" y="253" width="70" height="26" rx="4" fill="#334155" stroke="#fbbf24"/><text x="165" y="270" text-anchor="middle">HEADLIGHT</text>
<path d="M130 146 H100 V296 M130 186 H100 M130 226 H100 M130 266 H100" stroke="#94a3b8" stroke-width="2" fill="none"/>
</g>
</g>
<g stroke="#94a3b8" stroke-width="2"><path d="M130 296 H160"/><path d="M130 296 v0"/><path d="M135 296 h30 M142 302 h16 M148 308 h4" fill="none"/></g>
<text x="30" y="318" fill="#94a3b8" font-size="12">Buttons: pin to GND (active-low, internal pull-up)</text>
<!-- MPU -->
<rect x="660" y="120" width="200" height="170" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
<text x="760" y="150" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="600">MPU6050 (GY-521)</text>
<g fill="#e2e8f0" font-size="12"><text x="675" y="188">SCL</text><text x="675" y="218">SDA</text><text x="675" y="248">VCC</text><text x="675" y="274">GND</text></g>
<g stroke-width="2" fill="none">
<path d="M570 146 H620 V184 H660" stroke="#60a5fa"/>
<path d="M570 186 H610 V214 H660" stroke="#a78bfa"/>
<path d="M570 226 H600 V244 H660" stroke="#f87171"/>
<path d="M570 266 H590 V270 H660" stroke="#94a3b8"/>
</g>
<text x="770" y="318" text-anchor="middle" fill="#94a3b8" font-size="11">I2C3 · sampled every 100 ms</text>
<!-- LED -->
<path d="M330 366 H230 M170 366 H140" stroke="#f59e0b" stroke-width="2"/>
<rect x="170" y="356" width="60" height="20" rx="3" fill="#334155" stroke="#f59e0b"/><text x="200" y="371" text-anchor="middle" fill="#e2e8f0" font-size="11">R (series)</text>
<polygon points="110,354 110,378 134,366" fill="#fbbf24"/><line x1="134" y1="352" x2="134" y2="380" stroke="#fbbf24" stroke-width="2"/>
<text x="120" y="400" text-anchor="middle" fill="#fbbf24" font-size="12">Headlight LED → GND</text>
<!-- USB / PC -->
<path d="M450 390 V430" stroke="#94a3b8" stroke-width="2"/>
<rect x="320" y="430" width="260" height="60" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="450" y="455" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">PC · Chrome / Edge</text>
<text x="450" y="474" text-anchor="middle" fill="#94a3b8" font-size="12">Web Serial @ 115200 → 3D dashboard</text>
<text x="458" y="415" fill="#94a3b8" font-size="11">text telemetry: Ax Ay Az Gx Gy Gz Temp Button Left Right Head Mode</text>
<text x="450" y="535" text-anchor="middle" fill="#64748b" font-size="11">LED resistor value: check your build; diagram is a logical wiring map, not a PCB schematic.</text>
</svg>
