<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<title>Rotating the breadboard rotates the wheel on screen</title>
<rect width="900" height="380" fill="#0f172a"/>
<text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="600">Tilt the board → the 3D wheel follows</text>
<!-- Left: breadboard -->
<g transform="translate(170,190)">
 <g>
  <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" calcMode="spline"
    values="0;-35;0;35;0" keyTimes="0;0.25;0.5;0.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  <rect x="-110" y="-45" width="220" height="90" rx="6" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2"/>
  <line x1="-104" y1="-30" x2="104" y2="-30" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="-104" y1="30" x2="104" y2="30" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="-20" y="-14" width="34" height="28" rx="3" fill="#1d4ed8"/><text x="-3" y="4" text-anchor="middle" font-size="8" fill="#fff">MPU6050</text>
  <rect x="55" y="-16" width="46" height="32" rx="3" fill="#f8fafc" stroke="#94a3b8"/><text x="78" y="4" text-anchor="middle" font-size="8" fill="#334155">STM32</text>
  <circle cx="-85" cy="-8" r="6" fill="#fbbf24"/>
  <rect x="-70" y="-20" width="12" height="12" rx="2" fill="#334155"/><rect x="-70" y="8" width="12" height="12" rx="2" fill="#334155"/><rect x="-48" y="-6" width="12" height="12" rx="2" fill="#334155"/>
  <path d="M-30 -4 Q-60 -40 -20 -14" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M40 4 Q10 40 55 12" stroke="#22c55e" stroke-width="2" fill="none"/>
 </g>
</g>
<text x="170" y="305" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Breadboard (MPU6050)</text>
<text x="170" y="325" text-anchor="middle" fill="#94a3b8" font-size="12">gravity shows up in Ax / Ay</text>
<!-- Middle: data path -->
<g fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 6">
 <path d="M300 190 H590"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path>
</g>
<polygon points="590,181 608,190 590,199" fill="#60a5fa"/>
<text x="450" y="160" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">USB serial · 115200</text>
<text x="450" y="182" text-anchor="middle" fill="#94a3b8" font-size="11">Ax: Ay: Az: Gx: Gy: Gz: ...</text>
<text x="450" y="222" text-anchor="middle" fill="#94a3b8" font-size="11">angle from accelerometer atan2 + gyro filter</text>
<text x="450" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">→ rotate 3D model by that angle</text>
<!-- Right: screen -->
<rect x="620" y="80" width="250" height="190" rx="8" fill="#020617" stroke="#475569" stroke-width="3"/>
<text x="632" y="100" fill="#64748b" font-size="9">WHEEL · TELEMETRY</text>
<g transform="translate(745,185)">
 <g>
  <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" calcMode="spline"
    values="0;-35;0;35;0" keyTimes="0;0.25;0.5;0.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  <path d="M-80 -22 Q-60 -34 -30 -30 Q0 -22 30 -30 Q60 -34 80 -22 Q92 -4 78 38 Q66 56 48 38 Q40 18 28 14 L-28 14 Q-40 18 -48 38 Q-66 56 -78 38 Q-92 -4 -80 -22 Z" fill="#3b5fb0" stroke="#7aa2f7" stroke-width="2"/>
  <circle cx="0" cy="-6" r="13" fill="#2f4c91" stroke="#7aa2f7"/>
  <rect x="-74" y="-28" width="12" height="10" rx="2" fill="#93b4ff"/><rect x="62" y="-28" width="12" height="10" rx="2" fill="#93b4ff"/>
 </g>
</g>
<text x="745" y="305" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Dashboard (three.js)</text>
<text x="745" y="325" text-anchor="middle" fill="#94a3b8" font-size="12">same tilt, live at ~50 fps</text>
<text x="450" y="360" text-anchor="middle" fill="#64748b" font-size="11">Illustration: simplified wheel shape, not the real wheel.stl model.</text>
</svg>
